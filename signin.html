<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome back to SOL</title>
<meta name="description" content="Sign in to SOL. Static preview: nothing is submitted from this page.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="sol.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div class="scene" aria-hidden="true">
  <div class="glow"></div>
  <div class="stars"></div>
  <i class="streak s1"></i><i class="streak s2"></i><i class="streak s3"></i>
  <svg class="landscape" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" focusable="false">
    <defs>
      <linearGradient id="sol-water" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5a3f7a"/>
        <stop offset=".35" stop-color="#2d2058"/>
        <stop offset="1" stop-color="#0a0822"/>
      </linearGradient>
      <linearGradient id="sol-trail" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffcf7a" stop-opacity="0"/>
        <stop offset=".45" stop-color="#ffd98f"/>
        <stop offset="1" stop-color="#ffb266" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M0 470 L0 380 L90 300 L170 370 L260 262 L360 360 L440 330 L520 420 L600 470 Z" fill="#2a1d4f" opacity=".95"/>
    <path d="M1600 470 L1600 360 L1500 280 L1420 350 L1330 240 L1230 340 L1150 330 L1060 420 L990 470 Z" fill="#2a1d4f" opacity=".95"/>
    <g fill="#1d1440">
      <rect x="660" y="390" width="24" height="80"/><rect x="688" y="372" width="16" height="98"/>
      <rect x="708" y="410" width="30" height="60"/><rect x="742" y="380" width="20" height="90"/>
      <rect x="766" y="372" width="12" height="98"/><rect x="782" y="400" width="28" height="70"/>
      <rect x="814" y="372" width="22" height="98"/><rect x="840" y="420" width="34" height="50"/>
      <rect x="878" y="396" width="18" height="74"/><rect x="900" y="430" width="26" height="40"/>
    </g>
    <g fill="#ffd58a" opacity=".9">
      <circle cx="676" cy="416" r="1.6"/><circle cx="700" cy="394" r="1.6"/><circle cx="696" cy="396" r="1.6"/>
      <circle cx="722" cy="430" r="1.6"/><circle cx="752" cy="402" r="1.6"/><circle cx="770" cy="388" r="1.6"/>
      <circle cx="790" cy="420" r="1.6"/><circle cx="824" cy="392" r="1.6"/><circle cx="850" cy="440" r="1.6"/>
      <circle cx="886" cy="420" r="1.6"/><circle cx="908" cy="448" r="1.6"/>
    </g>
    <rect x="0" y="470" width="1600" height="430" fill="url(#sol-water)"/>
    <ellipse cx="800" cy="500" rx="210" ry="60" fill="#ffc77e" opacity=".22"/>
    <g stroke="#ffd58a" stroke-linecap="round" fill="none">
      <path d="M720 486h160" stroke-width="2" opacity=".5"/>
      <path d="M680 506h240" stroke-width="3" opacity=".35"/>
      <path d="M740 530h120" stroke-width="2" opacity=".3"/>
      <path d="M650 560h300" stroke-width="2.5" opacity=".22"/>
      <path d="M700 600h200" stroke-width="2" opacity=".18"/>
    </g>
    <path d="M-40 800 C 240 790, 420 826, 780 812 S 1260 796, 1640 808" fill="none" stroke="#ffcf7a" stroke-width="14" stroke-linecap="round" opacity=".18"/>
    <path d="M-40 800 C 240 790, 420 826, 780 812 S 1260 796, 1640 808" fill="none" stroke="url(#sol-trail)" stroke-width="3" stroke-linecap="round"/>
  </svg>
</div>

<div class="page">
  <main id="main" class="auth">
    <section class="card" aria-labelledby="title">
      <a class="logo logo-lg" href="index.html" aria-label="SOL home"><span>S</span><span class="o" aria-hidden="true"></span><span>L</span></a>

      <h1 class="title plain" id="title">Welcome Back</h1>
      <p class="sub">Your progress is remembered. Pick up where you left off, and keep moving forward with clarity.</p>

      <form class="form" novalidate>
        <label class="field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 7l8 6 8-6"/></svg>
          <span class="sr">Email address</span>
          <input type="email" name="email" placeholder="Email address" autocomplete="email">
        </label>
        <label class="field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <span class="sr">Password</span>
          <input type="password" name="password" placeholder="Password" autocomplete="current-password">
          <span class="eye" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg></span>
        </label>

        <div class="row-between">
          <label class="remember"><input class="box" type="checkbox" name="remember" checked><span>Remember me</span></label>
          <a class="link-gold" href="#">Forgot password?</a>
        </div>

        <button class="btn btn-gold btn-block" type="button" aria-describedby="door-status">Sign In <span aria-hidden="true">&rarr;</span></button>
      </form>

      <p class="divider quiet">Your progress, remembered.</p>
      <p class="foot">New to SOL? <a class="link-gold" href="signup.html">Create an account</a></p>
      <p class="door-status" id="door-status" role="status">Sign-in opens after the founder gate. This page submits nothing.</p>
    </section>
  </main>
</div>
</body>
</html>
