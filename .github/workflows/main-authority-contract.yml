name: SolContinuity Main Authority Contract

on:
  pull_request:
  push:
    branches:
      - main
      - fix/governance-symmetry
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify Sol main authority contract
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Syntax-check authority verifiers
        run: |
          node --check scripts/verify-main-push-authority.mjs
          node --check scripts/verify-main-provider-protection.mjs

      - name: Verify founder-owned non-force main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SOLCONTINUITY_REPOSITORY: ${{ github.repository }}
          SOLCONTINUITY_REF: ${{ github.ref }}
          SOLCONTINUITY_ACTOR: ${{ github.actor }}
          SOLCONTINUITY_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          SOLCONTINUITY_FORCED: ${{ toJSON(github.event.forced) }}
          SOLCONTINUITY_BEFORE_SHA: ${{ github.event.before }}
          SOLCONTINUITY_AFTER_SHA: ${{ github.event.after }}
        run: node scripts/verify-main-push-authority.mjs

      - name: Verify main push is ancestry-preserving
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          git cat-file -e "${BEFORE_SHA}^{commit}"
          git cat-file -e "${AFTER_SHA}^{commit}"
          git merge-base --is-ancestor "$BEFORE_SHA" "$AFTER_SHA"

      - name: Report provider protection before bootstrap
        if: github.ref != 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOLCONTINUITY_AUTHORITY_REPORT_ONLY: "1"
        run: node scripts/verify-main-provider-protection.mjs

      - name: Install exact dependencies and Playwright
        shell: bash
        run: ./setup.sh

      - name: Run canonical verification including Playwright
        shell: bash
        run: PYTHON_BIN=python3 npm run verify

      - name: Enforce provider protection on main
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-main-provider-protection.mjs

      - name: Retain verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-symmetry-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
