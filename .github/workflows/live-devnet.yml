name: live-devnet-evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-devnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact dispatched head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --no-audit --no-fund
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run founder-gated Solana Devnet evidence
        run: npm run evidence:devnet
        env:
          SOLCONTINUITY_DEVNET_KEYPAIR: ${{ secrets.SOLCONTINUITY_DEVNET_KEYPAIR }}
      - name: Run Playwright against the built console
        run: npm run test:e2e
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-devnet-evidence-${{ github.sha }}
          path: |
            test-results/live-devnet-evidence.json
            test-results/dashboard-proof.png
            playwright-report/
          if-no-files-found: warn
