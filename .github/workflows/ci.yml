name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Prove setup works without a usable python alias
        shell: bash
        run: |
          set -euo pipefail
          shim_dir="$RUNNER_TEMP/python3-only-path"
          mkdir -p "$shim_dir"
          printf '#!/usr/bin/env bash\necho "bare python alias must not be used" >&2\nexit 97\n' > "$shim_dir/python"
          chmod +x "$shim_dir/python"
          PATH="$shim_dir:$PATH" ./setup.sh
      - name: Verify with python alias blocked
        shell: bash
        run: |
          set -euo pipefail
          shim_dir="$RUNNER_TEMP/python3-only-path"
          PATH="$shim_dir:$PATH" PYTHON_BIN=python3 npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
