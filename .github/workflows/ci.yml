name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Verify immutable head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Prove setup works without a usable python alias
        shell: bash
        run: |
          set -euo pipefail
          shim_dir="$RUNNER_TEMP/python3-only-path"
          mkdir -p "$shim_dir"
          printf '#!/usr/bin/env bash\necho "bare python alias must not be used" >&2\nexit 97\n' > "$shim_dir/python"
          chmod +x "$shim_dir/python"
          PATH="$shim_dir:$PATH" ./setup.sh
      - name: Capture dependency audit evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results

          # Re-resolve lock metadata without installing lifecycle scripts. A committed
          # lock that cannot be reproduced from package.json is stale evidence.
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cp package-lock.json test-results/package-lock.generated.json
          sha256sum package-lock.json > test-results/package-lock.sha256
          git diff --exit-code -- package-lock.json

          full_status=0
          production_status=0
          npm audit --json > test-results/npm-audit-full.json || full_status=$?
          npm audit --omit=dev --json > test-results/npm-audit-production.json || production_status=$?

          # npm may return status 1 for either findings or an operational registry
          # failure. Require a real audit report shape instead of trusting the code.
          node - test-results/npm-audit-full.json test-results/npm-audit-production.json <<'NODE'
          const fs = require('node:fs');
          for (const reportPath of process.argv.slice(2)) {
            let report;
            try {
              report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            } catch (error) {
              console.error(`${reportPath}: invalid npm audit JSON`);
              process.exit(2);
            }
            if (!report || typeof report !== 'object' || report.error) {
              console.error(`${reportPath}: npm audit returned an operational error object`);
              process.exit(2);
            }
            const vulnerabilities = report.metadata?.vulnerabilities;
            if (!vulnerabilities || !Number.isInteger(vulnerabilities.total)) {
              console.error(`${reportPath}: npm audit report is missing metadata.vulnerabilities.total`);
              process.exit(2);
            }
          }
          NODE

          if [ "$full_status" -gt 1 ] || [ "$production_status" -gt 1 ]; then
            echo "npm audit failed operationally (full=$full_status production=$production_status)" >&2
            exit 2
          fi

          # The published package declares no production Node dependencies. Prove a
          # clean production-only install actually resolves to that empty graph.
          repo_root="$PWD"
          prod_dir="$(mktemp -d)"
          cp package.json package-lock.json "$prod_dir/"
          (
            cd "$prod_dir"
            npm ci --omit=dev --ignore-scripts --no-audit --no-fund
            npm ls --omit=dev --json > "$repo_root/test-results/npm-ls-production.json"
          )
          node - test-results/npm-ls-production.json <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const dependencies = report.dependencies ?? {};
          if (Object.keys(dependencies).length !== 0) {
            console.error(`production dependency graph is not empty: ${Object.keys(dependencies).join(', ')}`);
            process.exit(1);
          }
          NODE
      - name: Verify with python alias blocked
        shell: bash
        run: |
          set -euo pipefail
          shim_dir="$RUNNER_TEMP/python3-only-path"
          PATH="$shim_dir:$PATH" PYTHON_BIN=python3 npm run verify
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verification-evidence-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
  live-main-audit:
    name: Live main and exact candidate ancestry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live main, current PR head, and ancestry (read-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          [[ "$current_main" =~ $sha_pattern ]] || { echo "::error::Cannot resolve live main SHA"; exit 1; }
          [[ "$EVENT_HEAD_SHA" =~ $sha_pattern ]] || { echo "::error::Invalid candidate SHA"; exit 1; }
          candidate="$EVENT_HEAD_SHA"
          if [[ -n "$PR_NUMBER" ]]; then
            live_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            live_head="$(jq -r '.head.sha // empty' <<<"$live_pr")"
            live_base="$(jq -r '.base.sha // empty' <<<"$live_pr")"
            live_base_ref="$(jq -r '.base.ref // empty' <<<"$live_pr")"
            [[ "$live_base_ref" == "main" ]] || { echo "::error::PR targets ${live_base_ref}, not main"; exit 1; }
            [[ "$live_head" == "$EVENT_HEAD_SHA" ]] || { echo "::error::PR head advanced; event proof is stale"; exit 1; }
            echo "PR base snapshot: ${live_base}; authoritative comparison uses live main ${current_main}"
            candidate="$live_head"
          fi
          merge_base="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${current_main}...${candidate}" --jq '.merge_base_commit.sha')"
          [[ "$merge_base" == "$current_main" ]] || {
            echo "::error::Candidate is not based on live main ${current_main}. Update the branch and rerun exact-head checks."
            exit 1
          }
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" && "$candidate" != "$current_main" ]]; then
            echo "::error::This main run is superseded by ${current_main}"
            exit 1
          fi
          final_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          [[ "$final_main" == "$current_main" ]] || { echo "::error::Main advanced during audit; evidence expired"; exit 1; }
          if [[ -n "$PR_NUMBER" ]]; then
            final_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            [[ "$final_head" == "$candidate" ]] || { echo "::error::PR head advanced during audit"; exit 1; }
          fi
          {
            echo "### Live main candidate audit"
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Live main: ${current_main}"
            echo "- Candidate: ${candidate}"
            echo "- Merge base: ${merge_base}"
            echo "- Scope: Git ancestry and exact SHA only; tests, merge authorization, deployment and runtime remain separate."
          } >> "$GITHUB_STEP_SUMMARY"
