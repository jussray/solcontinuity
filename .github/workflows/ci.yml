name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Verify immutable head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Prove setup works without a usable python alias
        shell: bash
        run: |
          set -euo pipefail
          shim_dir="$RUNNER_TEMP/python3-only-path"
          mkdir -p "$shim_dir"
          printf '#!/usr/bin/env bash\necho "bare python alias must not be used" >&2\nexit 97\n' > "$shim_dir/python"
          chmod +x "$shim_dir/python"
          PATH="$shim_dir:$PATH" ./setup.sh
      - name: Verify with python alias blocked
        shell: bash
        run: |
          set -euo pipefail
          shim_dir="$RUNNER_TEMP/python3-only-path"
          PATH="$shim_dir:$PATH" PYTHON_BIN=python3 npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
